<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Route Flyover Engine</title>
    
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
    <script src="https://unpkg.com/webm-muxer/build/webm-muxer.js"></script>

    <style>
        /* MODERN DESIGN SYSTEM */
        :root {
            --bg-dark: #111;
            --surface: #ffffff;
            --surface-hover: #f9f9fb;
            --border: #e2e2e8;
            --text-main: #242428;
            --text-muted: #6d6d78;
            --accent: #fc4c02; /* Strava Orange */
            --accent-hover: #e34300;
            --blue: #00aeff;
            --radius: 8px;
            --shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg-dark); overflow: hidden; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        
        /* Dashboard Container */
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            bottom: 20px; 
            width: 360px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
            pointer-events: none;
        }

        /* Scrollable inner content */
        .panel-content {
            pointer-events: auto;
            flex: 1; 
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 4px;
        }

        .panel-content::-webkit-scrollbar { width: 6px; }
        .panel-content::-webkit-scrollbar-track { background: transparent; }
        .panel-content::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }

        h2 { margin: 0 0 4px 0; font-size: 24px; font-weight: 800; color: var(--surface); text-shadow: 0 2px 8px rgba(0,0,0,0.5); pointer-events: auto;}
        
        /* Collapsible Cards */
        details {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            overflow: hidden;
            transition: all 0.2s ease;
            flex-shrink: 0; 
        }

        summary {
            padding: 16px;
            font-weight: 700;
            font-size: 14px;
            color: var(--text-main);
            cursor: pointer;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface);
            user-select: none;
        }

        summary:hover { background: var(--surface-hover); }
        summary::-webkit-details-marker { display: none; }
        
        summary::after {
            content: '+';
            color: var(--accent);
            font-size: 18px;
            transition: transform 0.2s ease;
        }
        details[open] summary::after { content: '−'; }
        details[open] summary { border-bottom: 1px solid var(--border); }

        .details-body { padding: 16px; display: flex; flex-direction: column; gap: 16px; }

        /* Controls */
        .control-group { display: flex; flex-direction: column; gap: 6px; }
        .row-group { display: flex; gap: 12px; }
        .row-group > * { flex: 1; }

        label { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-main); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;}
        .val-display { color: var(--accent); font-weight: 700; }
        
        input[type="file"] { display: none; }
        input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; height: 4px; background: #efefef; border-radius: 4px; appearance: none; outline: none; margin-top: 4px;}
        input[type="range"]::-webkit-slider-thumb { appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.2); transition: transform 0.1s; }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }
        input[type="color"] { width: 100%; height: 36px; border: 1px solid var(--border); border-radius: var(--radius); padding: 2px; cursor: pointer; background: #fff; }

        .text-input, .select-input { width: 100%; padding: 10px; background: #ffffff; color: var(--text-main); border: 1px solid var(--border); border-radius: var(--radius); box-sizing: border-box; font-family: inherit; font-size: 13px; font-weight: 500; transition: all 0.2s ease; }
        .text-input:focus, .select-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(252, 76, 2, 0.1); }

        .btn { display: flex; align-items: center; justify-content: center; width: 100%; padding: 12px; border-radius: var(--radius); cursor: pointer; font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; transition: all 0.2s ease; box-sizing: border-box; border: none; }
        .btn-upload { background: var(--surface-hover); color: var(--text-main); border: 1px solid var(--border); padding: 10px; font-size: 12px; }
        .btn-upload:hover { background: #ececf1; }
        .btn-primary { background: var(--accent); color: white; box-shadow: 0 2px 10px rgba(252, 76, 2, 0.3); }
        .btn-primary:hover:not(:disabled) { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 4px 15px rgba(252, 76, 2, 0.4); }
        .btn-primary:disabled, .btn-secondary:disabled { background: #e0e0e5; color: #a0a0a5; cursor: not-allowed; box-shadow: none; transform: none; }
        .btn-secondary { background: var(--text-main); color: white; }
        .btn-secondary:hover:not(:disabled) { background: #000; }

        /* Floating Playback Controls */
        .playback-bar {
            background: var(--surface);
            padding: 12px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            display: flex;
            gap: 8px;
            pointer-events: auto;
            flex-shrink: 0;
        }

        .checkbox-container { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--text-main); text-transform: uppercase;}
        .checkbox-container input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0;}

        #status { font-size: 12px; color: var(--surface); text-align: left; margin-top: 4px; font-weight: 600; text-shadow: 0 1px 4px rgba(0,0,0,0.5); pointer-events: auto; flex-shrink: 0;}

        /* HUD Overlay */
        #stats-overlay {
            position: absolute;
            bottom: 40px;
            right: 40px;
            display: flex;
            gap: 12px;
            pointer-events: none;
            z-index: 5;
            display: none;
            font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace;
            transform-origin: bottom right;
        }
        .stat-box {
            background: rgba(15, 15, 20, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            height: 60px;
            padding: 0 20px;
            border-left: 6px solid;
            position: relative;
            overflow: hidden;
            border-top: 1px solid rgba(255,255,255,0.05);
            border-right: 1px solid rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .stat-label { font-size: 14px; color: rgba(255, 255, 255, 0.5); font-weight: 700; text-align: right; margin-right: 15px; letter-spacing: 1px; }
        .stat-value { font-size: 32px; font-weight: 800; }
    </style>
</head>
<body>

<div id="map"></div>
<div id="stats-overlay"></div>

<div id="ui-panel">
    <h2>Flyover Engine</h2>
    
    <div class="panel-content">
        <details open>
            <summary>1. Data Import</summary>
            <div class="details-body">
                <div class="control-group">
                    <label for="gpx-upload" class="btn btn-upload">Load GPX Route</label>
                    <input type="file" id="gpx-upload" accept=".gpx" />
                </div>
                <div class="control-group">
                    <label for="dexcom-upload" class="btn btn-upload">Load CGM Data (CSV)</label>
                    <input type="file" id="dexcom-upload" accept=".csv,.txt" />
                </div>
            </div>
        </details>

        <details>
            <summary>2. Camera Controls</summary>
            <div class="details-body">
                <div class="control-group">
                    <label>Playback Speed <span id="speed-display" class="val-display">1.0x</span></label>
                    <input type="range" id="speed-slider" min="0.1" max="25" step="0.1" value="1">
                </div>
                <div class="control-group">
                    <label>Base Zoom <span id="zoom-display" class="val-display">15.8</span></label>
                    <input type="range" id="zoom-slider" min="13.0" max="18.0" step="0.1" value="15.8">
                </div>
                <div class="control-group">
                    <label>Pitch (Angle) <span id="pitch-display" class="val-display">60°</span></label>
                    <input type="range" id="pitch-slider" min="0" max="85" step="1" value="60">
                </div>
                
                <div class="control-group">
                    <label>Vertical Framing <span id="framing-display" class="val-display">Center</span></label>
                    <input type="range" id="framing-slider" min="-300" max="300" step="10" value="0">
                </div>
                <div class="control-group">
                    <label>Rotation Offset <span id="rotation-display" class="val-display">0°</span></label>
                    <input type="range" id="rotation-slider" min="-180" max="180" step="1" value="0">
                </div>

                <div class="control-group">
                    <label>Camera Smoothness <span id="smoothness-display" class="val-display">45%</span></label>
                    <input type="range" id="smoothness-slider" min="0" max="100" step="1" value="45">
                </div>
                <div class="control-group">
                    <label>Terrain Exaggeration <span id="terrain-display" class="val-display">1.0x</span></label>
                    <input type="range" id="terrain-slider" min="0" max="5" step="0.1" value="1">
                </div>

                <hr style="border: 0; border-top: 1px solid var(--border); width: 100%; margin: 4px 0;">
                
                <div class="control-group" style="gap: 10px;">
                    <label class="checkbox-container"><input type="checkbox" id="show-intro-checkbox" checked> Show Full Path Intro</label>
                    <label class="checkbox-container"><input type="checkbox" id="show-outro-checkbox" checked> Show Full Path Outro</label>
                </div>
                <div class="row-group">
                    <div class="control-group">
                        <label>Hold Time <span id="hold-duration-display" class="val-display">1.5s</span></label>
                        <input type="range" id="hold-duration-slider" min="0" max="5" step="0.5" value="1.5">
                    </div>
                    <div class="control-group">
                        <label>Transition <span id="transition-duration-display" class="val-display">2.0s</span></label>
                        <input type="range" id="transition-duration-slider" min="0.5" max="5" step="0.5" value="2.0">
                    </div>
                </div>
            </div>
        </details>

        <details>
            <summary>3. Visuals & HUD</summary>
            <div class="details-body">
                <div class="control-group" style="gap: 10px;">
                    <label class="checkbox-container"><input type="checkbox" id="show-mileage-checkbox"> Mileage Stat</label>
                    <label class="checkbox-container"><input type="checkbox" id="show-timer-checkbox"> Elapsed Timer</label>
                    <label class="checkbox-container"><input type="checkbox" id="show-pace-checkbox"> Pace</label>
                    <label class="checkbox-container"><input type="checkbox" id="show-hr-checkbox"> Heart Rate</label>
                    <label class="checkbox-container"><input type="checkbox" id="show-glucose-checkbox"> Glucose Level</label>
                </div>
                
                <div class="row-group">
                    <div class="control-group">
                        <label>HUD Layout</label>
                        <select id="stat-layout-select" class="select-input">
                            <option value="vertical" selected>Vertical</option>
                            <option value="horizontal">Horizontal</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label>HUD Size <span id="stat-size-display" class="val-display">1.0x</span></label>
                        <input type="range" id="stat-size-slider" min="0.5" max="2.0" step="0.1" value="1.0">
                    </div>
                </div>

                <hr style="border: 0; border-top: 1px solid var(--border); width: 100%; margin: 4px 0;">

                <div class="control-group">
                    <label>Route Mode</label>
                    <select id="route-mode" class="select-input">
                        <option value="solid" selected>Solid Route</option>
                        <option value="progress">Dynamic Trail</option>
                        <option value="hidden">Hidden</option>
                    </select>
                </div>

                <div class="row-group">
                    <div class="control-group">
                        <label>Past Route</label>
                        <input type="color" id="route-color-past" value="#fc4c02">
                    </div>
                    <div class="control-group">
                        <label>Future Route</label>
                        <input type="color" id="route-color-future" value="#6d6d78">
                    </div>
                </div>

                <div class="control-group">
                    <label>Route Thickness <span id="route-thickness-display" class="val-display">10px</span></label>
                    <input type="range" id="route-thickness-slider" min="2" max="20" step="1" value="10">
                </div>

                <hr style="border: 0; border-top: 1px solid var(--border); width: 100%; margin: 4px 0;">

                <div class="control-group">
                    <label>Runner Size <span id="runner-size-display" class="val-display">10</span></label>
                    <input type="range" id="runner-size-slider" min="2" max="20" step="1" value="10">
                </div>

                <div class="row-group">
                    <div class="control-group">
                        <label>Runner Fill</label>
                        <input type="color" id="runner-color" value="#ffffff">
                    </div>
                    <div class="control-group">
                        <label>Outline</label>
                        <input type="color" id="runner-outline-color" value="#000000">
                    </div>
                </div>

                <div class="control-group">
                    <label for="runner-image-upload" class="btn btn-upload">Upload Custom Avatar</label>
                    <input type="file" id="runner-image-upload" accept="image/*" />
                </div>
            </div>
        </details>

        <details>
            <summary>4. Video Export</summary>
            <div class="details-body">
                <div class="control-group">
                    <label>File Name</label>
                    <input type="text" id="export-filename" class="text-input" value="My_Epic_Run">
                </div>
                <div class="row-group">
                    <div class="control-group">
                        <label>Resolution</label>
                        <select id="export-res" class="select-input">
                            <option value="720">720p (HD)</option>
                            <option value="1080">1080p (FHD)</option>
                            <option value="1440">2K (1440p)</option>
                            <option value="2160" selected>4K (UHD)</option>
                            <option value="4320">8K (FUHD)</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label>Frame Rate</label>
                        <select id="export-fps" class="select-input">
                            <option value="24">24 FPS</option>
                            <option value="30">30 FPS</option>
                            <option value="60" selected>60 FPS</option>
                        </select>
                    </div>
                </div>
                <button id="export-btn" class="btn btn-primary" disabled>Export Video</button>
            </div>
        </details>
    </div>

    <div class="playback-bar">
        <button id="play-btn" class="btn btn-primary" disabled>Play</button>
        <button id="pause-btn" class="btn btn-upload" disabled>Pause</button>
        <button id="stop-btn" class="btn btn-upload" disabled>Stop</button>
    </div>
    
    <div id="status">Ready for GPX Upload.</div>
</div>

<script>
    const map = new maplibregl.Map({
        container: 'map',
        center: [-122.4194, 37.7749],
        zoom: 11,
        pitch: 60,
        bearing: 0,
        preserveDrawingBuffer: true,
        style: {
            version: 8,
            sources: {
                'satellite-tiles': { type: 'raster', tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'], tileSize: 256, maxzoom: 17 },
                'terrain-source': { type: 'raster-dem', tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'], encoding: 'terrarium', tileSize: 256, maxzoom: 13 }
            },
            layers: [{ id: 'satellite-layer', type: 'raster', source: 'satellite-tiles' }],
            terrain: { source: 'terrain-source', exaggeration: 1 }
        }
    });

    let routeCoordinates = [];
    let originalDataPoints = []; 
    let dexcomData = [];         
    let animationId = null;
    let currentDistance = 0.0;
    
    let currentCameraBearing = 0; 
    let currentCameraPos = [0, 0];
    let currentRunnerPos = [0, 0]; 
    
    // Playback State Machine Variables
    let playPhase = 'none';
    let playFrameIdx = 0;
    let outroStartCenter = [0, 0];
    let outroStartBearing = 0;

    let cameraFramingOffset = 0;
    let cameraRotationOffset = 0;

    let rawRouteLine = null;
    let totalRouteDistance = 0;
    let speedMultiplier = 1.0;
    let cameraZoom = 15.8;
    let cameraPitch = 60;
    let cameraSmoothness = 45; 
    let useCustomImage = false; 

    // Track Loop Detection State
    let isTrackRun = false;
    let trackCenter = [0, 0];

    // Resolution Config Map
    const resolutionMap = {
        "720": { w: 1280, h: 720, br: 10_000_000 },
        "1080": { w: 1920, h: 1080, br: 25_000_000 },
        "1440": { w: 2560, h: 1440, br: 40_000_000 },
        "2160": { w: 3840, h: 2160, br: 80_000_000 },
        "4320": { w: 7680, h: 4320, br: 150_000_000 }
    };

    // HELPERS FOR INTERPOLATION
    function lerp(start, end, t) { return start + (end - start) * t; }
    function lerpLngLat(start, end, t) { return [lerp(start[0], end[0], t), lerp(start[1], end[1], t)]; }
    function lerpBearing(start, end, t) {
        let diff = end - start;
        while (diff > 180) diff -= 360;
        while (diff < -180) diff += 360;
        return start + diff * t;
    }
    function easeInOut(t) { return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t; }

    function getOverviewCamera() {
        if (routeCoordinates.length === 0) return { center: [0,0], zoom: 11, pitch: 0, bearing: 0 };
        const bounds = routeCoordinates.reduce((b, c) => b.extend(c), new maplibregl.LngLatBounds(routeCoordinates[0], routeCoordinates[0]));
        const camera = map.cameraForBounds(bounds, { padding: 50 });
        return { center: [camera.center.lng, camera.center.lat], zoom: camera.zoom, pitch: 0, bearing: 0 };
    }

    function formatTime(ms) {
        if (isNaN(ms) || ms < 0) return "00:00";
        let totalSeconds = Math.floor(ms / 1000);
        let hours = Math.floor(totalSeconds / 3600);
        let minutes = Math.floor((totalSeconds % 3600) / 60);
        let seconds = totalSeconds % 60;
        if (hours > 0) return `${hours}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    map.on('load', () => {
        map.addSource('start-point', { 'type': 'geojson', 'data': { 'type': 'Feature', 'geometry': { 'type': 'Point', 'coordinates': [0, 0] } } });
        map.addLayer({ 'id': 'start-circle-bg', 'type': 'circle', 'source': 'start-point', 'paint': { 'circle-radius': 12, 'circle-color': '#ffffff', 'circle-opacity': 0 } });
        map.addLayer({ 'id': 'start-circle', 'type': 'circle', 'source': 'start-point', 'paint': { 'circle-radius': 8, 'circle-color': '#00a859', 'circle-opacity': 0 } });

        map.addSource('route-past', { 'type': 'geojson', 'data': { 'type': 'Feature', 'geometry': { 'type': 'LineString', 'coordinates': [] } } });
        map.addLayer({ 'id': 'route-line-past-glow', 'type': 'line', 'source': 'route-past', 'layout': { 'line-join': 'round', 'line-cap': 'round' }, 'paint': { 'line-color': '#fc4c02', 'line-width': 20, 'line-opacity': 0.4, 'line-blur': 8 } });
        map.addLayer({ 'id': 'route-line-past-casing', 'type': 'line', 'source': 'route-past', 'layout': { 'line-join': 'round', 'line-cap': 'round' }, 'paint': { 'line-color': '#000000', 'line-width': 14, 'line-opacity': 0.3 } });
        map.addLayer({ 'id': 'route-line-past', 'type': 'line', 'source': 'route-past', 'layout': { 'line-join': 'round', 'line-cap': 'round' }, 'paint': { 'line-color': '#fc4c02', 'line-width': 10, 'line-opacity': 1.0 } });

        map.addSource('route-future', { 'type': 'geojson', 'data': { 'type': 'Feature', 'geometry': { 'type': 'LineString', 'coordinates': [] } } });
        map.addLayer({ 'id': 'route-line-future-glow', 'type': 'line', 'source': 'route-future', 'layout': { 'line-join': 'round', 'line-cap': 'round' }, 'paint': { 'line-color': '#6d6d78', 'line-width': 20, 'line-opacity': 0, 'line-blur': 8 } });
        map.addLayer({ 'id': 'route-line-future-casing', 'type': 'line', 'source': 'route-future', 'layout': { 'line-join': 'round', 'line-cap': 'round' }, 'paint': { 'line-color': '#000000', 'line-width': 14, 'line-opacity': 0 } });
        map.addLayer({ 'id': 'route-line-future', 'type': 'line', 'source': 'route-future', 'layout': { 'line-join': 'round', 'line-cap': 'round' }, 'paint': { 'line-color': '#6d6d78', 'line-width': 10, 'line-opacity': 0 } }); 

        map.addSource('finish-point', { 'type': 'geojson', 'data': { 'type': 'Feature', 'geometry': { 'type': 'Point', 'coordinates': [0, 0] } } });
        map.addLayer({ 'id': 'finish-circle-bg', 'type': 'circle', 'source': 'finish-point', 'paint': { 'circle-radius': 12, 'circle-color': '#ffffff', 'circle-opacity': 0 } });
        map.addLayer({ 'id': 'finish-circle', 'type': 'circle', 'source': 'finish-point', 'paint': { 'circle-radius': 8, 'circle-color': '#fc4c02', 'circle-opacity': 0 } });

        map.addSource('runner', { 'type': 'geojson', 'data': { 'type': 'Feature', 'geometry': { 'type': 'Point', 'coordinates': [0, 0] } } });
        map.addLayer({ 'id': 'runner-point', 'type': 'circle', 'source': 'runner', 'paint': { 'circle-radius': 10, 'circle-color': '#ffffff', 'circle-stroke-width': 4, 'circle-stroke-color': '#000000', 'circle-opacity': 0, 'circle-stroke-opacity': 0 } });
        map.addLayer({ 'id': 'runner-point-symbol', 'type': 'symbol', 'source': 'runner', 'layout': { 'icon-image': 'custom-runner', 'icon-size': 1.0, 'icon-allow-overlap': true, 'icon-rotation-alignment': 'viewport' }, 'paint': { 'icon-opacity': 0 } });
    });

    function showStartFinish() {
        if (routeCoordinates.length > 0) {
            map.setPaintProperty('start-circle-bg', 'circle-opacity', 1);
            map.setPaintProperty('start-circle', 'circle-opacity', 1);
            map.setPaintProperty('finish-circle-bg', 'circle-opacity', 1);
            map.setPaintProperty('finish-circle', 'circle-opacity', 1);
        }
    }

    function showRunner() {
        if (useCustomImage) {
            map.setPaintProperty('runner-point', 'circle-opacity', 0);
            map.setPaintProperty('runner-point', 'circle-stroke-opacity', 0);
            map.setPaintProperty('runner-point-symbol', 'icon-opacity', 1);
        } else {
            map.setPaintProperty('runner-point', 'circle-opacity', 1);
            map.setPaintProperty('runner-point', 'circle-stroke-opacity', 1);

    function parseGPX(xmlText) {
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, "text/xml");
        const trackPoints = xmlDoc.getElementsByTagName('trkpt');
        
        routeCoordinates = [];
        originalDataPoints = [];
        let cumDist = 0;

        for (let i = 0; i < trackPoints.length; i++) {
            const lon = parseFloat(trackPoints[i].getAttribute('lon'));
            const lat = parseFloat(trackPoints[i].getAttribute('lat'));
            
            let timeMs = null;
            const timeTags = trackPoints[i].getElementsByTagName('time');
            if (timeTags.length > 0) timeMs = Date.parse(timeTags[0].textContent);

            let hr = null;
            const allTags = trackPoints[i].getElementsByTagName('*');
            for(let j=0; j<allTags.length; j++) {
                if(allTags[j].localName === 'hr') { hr = parseInt(allTags[j].textContent, 10); break; }
            }

            routeCoordinates.push([lon, lat]);

            if (i > 0) cumDist += turf.distance(turf.point(routeCoordinates[i-1]), turf.point(routeCoordinates[i]), {units: 'kilometers'});
            originalDataPoints.push({ dist: cumDist, time: timeMs, hr: hr });
        }

        if (routeCoordinates.length > 1) {
            rawRouteLine = turf.lineString(routeCoordinates);
            totalRouteDistance = turf.length(rawRouteLine, {units: 'kilometers'});
            
            // MATH-BASED CENTER OF MASS (Perfectly finds the exact center of track/loops ignoring walk warmups)
            let sumLng = 0, sumLat = 0;
            for(let i=0; i<routeCoordinates.length; i++) {
                sumLng += routeCoordinates[i][0];
                sumLat += routeCoordinates[i][1];
            }
            trackCenter = [sumLng / routeCoordinates.length, sumLat / routeCoordinates.length];

            // MATH-BASED LOOP DETECTION (Uses ratio of total run distance to area width to guarantee it detects loops correctly)
            const bounds = routeCoordinates.reduce((b, c) => b.extend(c), new maplibregl.LngLatBounds(routeCoordinates[0], routeCoordinates[0]));
            const diagDist = turf.distance(turf.point([bounds.getWest(), bounds.getSouth()]), turf.point([bounds.getEast(), bounds.getNorth()]), {units: 'kilometers'});
            
            if (diagDist > 0 && (totalRouteDistance / diagDist) > 3.0) {
                isTrackRun = true;
                console.log("Lap Mode Auto-Engaged! Ratio: ", (totalRouteDistance / diagDist));
            } else {
                isTrackRun = false;
            }

            map.getSource('start-point').setData({ 'type': 'Feature', 'geometry': { 'type': 'Point', 'coordinates': routeCoordinates[0] } });
            map.getSource('finish-point').setData({ 'type': 'Feature', 'geometry': { 'type': 'Point', 'coordinates': routeCoordinates[routeCoordinates.length - 1] } });
            showStartFinish();

            updateRouteSlicingByDist(0);
            
            const overview = getOverviewCamera();
            map.jumpTo({ center: overview.center, zoom: overview.zoom, pitch: overview.pitch, bearing: overview.bearing, padding: { top: 0, bottom: 0, left: 0, right: 0 } });
            
            document.getElementById('play-btn').disabled = false;
            document.getElementById('export-btn').disabled = false;
            document.getElementById('status').innerText = 'GPX Processed Successfully.';
        }
    }

    // GENERAL CGM PARSER
    document.getElementById('dexcom-upload').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            const text = event.target.result;
            const lines = text.split('\n');
            dexcomData = [];
            let timeIdx = -1, glucIdx = -1;
            
            for(let i=0; i<lines.length; i++) {
                if(!lines[i].trim()) continue;
                const cols = lines[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || lines[i].split(',');
                const cleanCols = cols.map(c => c.replace(/^"|"$/g, '').trim());

                if (timeIdx === -1 && glucIdx === -1) {
                    const tI = cleanCols.findIndex(c => c.toLowerCase().match(/time|date/));
                    const gI = cleanCols.findIndex(c => c.toLowerCase().match(/glucose|mg\/dl|value/) && !c.toLowerCase().includes('type'));
                    if (tI >= 0 && gI >= 0) { timeIdx = tI; glucIdx = gI; }
                    continue;
                }

                if (timeIdx >= 0 && glucIdx >= 0 && cleanCols.length > Math.max(timeIdx, glucIdx)) {
                    let tsStr = cleanCols[timeIdx].replace(' ', 'T'); 
                    const ts = Date.parse(tsStr);
                    const val = parseInt(cleanCols[glucIdx], 10);
                    if (!isNaN(ts) && !isNaN(val)) dexcomData.push({ time: ts, glucose: val });
                }
            }
            dexcomData.sort((a,b) => a.time - b.time);
            document.getElementById('status').innerText = `Loaded ${dexcomData.length} CGM Readings.`;
        };
        reader.readAsText(file);
    });

    // --- PHYSICS ENGINE ---
    function calculateCameraPhysics(dist, totalDist, currentB) {
        const runnerPoint = turf.along(rawRouteLine, dist, {units: 'kilometers'});
        const rPos = runnerPoint.geometry.coordinates;

        const lookAhead = 0.05 + (cameraSmoothness / 100) * 0.25; 
        const targetPoint = turf.along(rawRouteLine, Math.min(dist + lookAhead, totalDist), {units: 'kilometers'});

        let targetB = turf.bearing(runnerPoint, targetPoint);
        let bDiff = targetB - currentB;
        
        while (bDiff > 180) bDiff -= 360;
        while (bDiff < -180) bDiff += 360;

        let bWeight = Math.pow((100 - cameraSmoothness) / 100, 3) * 0.15 + 0.002;
        let newBearing = currentB + (bDiff * bWeight);

        return { rPos, newBearing, targetB };
    }

    // Telemetry Panel Overhead Logic
    function renderStatsOverlay(dist) {
        const overlay = document.getElementById('stats-overlay');
        const showMileage = document.getElementById('show-mileage-checkbox').checked;

        const showPace = document.getElementById('show-pace-checkbox').checked;
        const showHR = document.getElementById('show-hr-checkbox').checked;
        const showGlucose = document.getElementById('show-glucose-checkbox').checked;
        
        const scale = document.getElementById('stat-size-slider').value;
        const layout = document.getElementById('stat-layout-select').value;
        
        overlay.style.transform = `scale(${scale})`;
        overlay.style.flexDirection = layout === 'horizontal' ? 'row-reverse' : 'column-reverse';

        let html = [];
        const pt = originalDataPoints.find(p => p.dist >= dist) || originalDataPoints[originalDataPoints.length-1];

        if (showMileage) {
            html.push(`
                <div class="stat-box" style="border-left-color: #ffffff;">
                    <div class="stat-label">DISTANCE</div>
                    <div class="stat-value" style="color: #ffffff;">${(dist * 0.621371).toFixed(2)} MI</div>
                </div>
            `);
        }
        
        if (showTimer) {
            let timerTxt = "00:00";
            if (pt && pt.time && originalDataPoints.length > 0 && originalDataPoints[0].time) {
                timerTxt = formatTime(pt.time - originalDataPoints[0].time);
            }
            html.push(`
                <div class="stat-box" style="border-left-color: #00aeff;">
                    <div class="stat-label">ELAPSED</div>
                    <div class="stat-value" style="color: #00aeff;">${timerTxt}</div>
                </div>
            `);
        }

        if (showPace) {
            let paceTxt = "--:-- /MI";
            if (pt && pt.time && originalDataPoints.length > 0 && originalDataPoints[0].time && dist > 0) {
                let elapsedMins = (pt.time - originalDataPoints[0].time) / 60000;
                let distMi = dist * 0.621371;
                if (distMi > 0.02) { 
                    let paceMins = elapsedMins / distMi;
                    if (paceMins < 99) {
                        let pM = Math.floor(paceMins);
                        let pS = Math.floor((paceMins - pM) * 60);
                        paceTxt = `${pM}:${pS.toString().padStart(2, '0')} /MI`;
                    }
                }
            }
            html.push(`
                <div class="stat-box" style="border-left-color: #ffb800;">
                    <div class="stat-label">PACE</div>
                    <div class="stat-value" style="color: #ffb800;">${paceTxt}</div>
                </div>
            `);
        }

        if (showHR) {
            let hrTxt = "-- BPM";
            if (pt && pt.hr) hrTxt = pt.hr + " BPM";
            html.push(`
                <div class="stat-box" style="border-left-color: #fc4c02;">
                    <div class="stat-label">HEART RATE</div>
                    <div class="stat-value" style="color: #fc4c02;">${hrTxt}</div>
                </div>
            `);
        }

        if (showGlucose) {
            let glucTxt = "-- mg/dL";
            if (pt && pt.time && dexcomData.length > 0) {
                let closest = dexcomData[0];
                let minDiff = Math.abs(pt.time - closest.time);
                for(let i=1; i<dexcomData.length; i++) {
                    let diff = Math.abs(pt.time - dexcomData[i].time);
                    if (diff < minDiff) { minDiff = diff; closest = dexcomData[i]; }
                }
                if (minDiff < 15 * 60 * 1000) glucTxt = closest.glucose + " mg/dL";
            }
            html.push(`
                <div class="stat-box" style="border-left-color: #00a859;">
                    <div class="stat-label">GLUCOSE</div>
                    <div class="stat-value" style="color: #00a859;">${glucTxt}</div>
                </div>
            `);
        }

        if (html.length > 0) {
            overlay.style.display = 'flex';
            overlay.innerHTML = html.join('');
        } else {
            overlay.style.display = 'none';
        }
    }

    function drawSickHUD(ctx, rightX, y, label, value, color, scaleFactor) {
        ctx.save();
        ctx.textBaseline = "middle";
        
        const fontSizeVal = 32 * scaleFactor;
        const fontSizeLab = 14 * scaleFactor;
        const gap = 15 * scaleFactor;
        const padX = 20 * scaleFactor;
        const h = 60 * scaleFactor;
        const borderRadius = 8 * scaleFactor;
        const borderWidth = 6 * scaleFactor;

        ctx.font = `bold ${fontSizeVal}px ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace`;
        const valW = ctx.measureText(value).width;
        ctx.font = `bold ${fontSizeLab}px ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace`;
        const labW = ctx.measureText(label).width;
        
        const w = labW + gap + valW + padX * 2;
        const boxX = rightX - w;
        
        ctx.fillStyle = "rgba(15, 15, 20, 0.85)";
        ctx.shadowColor = "rgba(0,0,0,0.5)";
        ctx.shadowBlur = 12 * scaleFactor;
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(boxX, y, w, h, borderRadius);
        else ctx.rect(boxX, y, w, h);
        ctx.fill();
        
        ctx.shadowBlur = 0;
        ctx.fillStyle = color;
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(boxX, y, borderWidth, h, [borderRadius, 0, 0, borderRadius]);
        else ctx.rect(boxX, y, borderWidth, h);
        ctx.fill();
        
        ctx.fillStyle = "rgba(255,255,255,0.5)";
        ctx.textAlign = "right";
        ctx.fillText(label, boxX + padX + labW, y + h/2);
        
        ctx.fillStyle = color;
        ctx.textAlign = "left";
        ctx.font = `bold ${fontSizeVal}px ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace`;
        ctx.fillText(value, boxX + padX + labW + gap, y + h/2);
        
        ctx.restore();
        return { width: w, height: h };
    }

    // --- PLAYBACK ENGINE WITH CINEMATIC ZOOM PHASES ---
    document.getElementById('play-btn').addEventListener('click', () => {
        if (animationId) cancelAnimationFrame(animationId);
        document.getElementById('play-btn').disabled = true;
        document.getElementById('pause-btn').disabled = false;
        document.getElementById('stop-btn').disabled = false;
        document.getElementById('export-btn').disabled = true;
        showRunner();

        const previewFPS = 60; 
        const enableIntro = document.getElementById('show-intro-checkbox').checked;
        const enableOutro = document.getElementById('show-outro-checkbox').checked;
        const holdFrames = parseFloat(document.getElementById('hold-duration-slider').value) * previewFPS;
        const transFrames = parseFloat(document.getElementById('transition-duration-slider').value) * previewFPS;

        if (currentDistance === 0.0 && playFrameIdx === 0 && playPhase === 'none') {
            currentCameraBearing = isTrackRun ? 0 : calculateCameraPhysics(0, totalRouteDistance, 0).targetB;
            currentCameraPos = isTrackRun ? [...trackCenter] : [...routeCoordinates[0]];
            currentRunnerPos = [...routeCoordinates[0]];
            playPhase = 'intro_hold';
        }

        const step = (0.24 * speedMultiplier) / previewFPS;

        function frame() {
            let padTop = cameraFramingOffset > 0 ? cameraFramingOffset : 0;
            let padBottom = cameraFramingOffset < 0 ? Math.abs(cameraFramingOffset) : 0;

            const overview = getOverviewCamera();
            const physStart = calculateCameraPhysics(0, totalRouteDistance, currentCameraBearing);
            const startBearing = isTrackRun ? 0 : physStart.targetB;
            const startPos = isTrackRun ? trackCenter : routeCoordinates[0];

            if (playPhase === 'intro_hold') {
                if (!enableIntro || holdFrames === 0) {
                    playPhase = enableIntro ? 'intro_trans' : 'run';
                    playFrameIdx = 0;
                    animationId = requestAnimationFrame(frame);
                    return;
                }
                map.getSource('runner').setData({ 'type': 'Feature', 'geometry': { 'type': 'Point', 'coordinates': routeCoordinates[0] } });
                updateRouteSlicingByDist(0);
                map.jumpTo({ center: overview.center, zoom: overview.zoom, pitch: 0, bearing: 0, padding: { top: 0, bottom: 0, left: 0, right: 0 } });
                renderStatsOverlay(0);
                
                playFrameIdx++;
                if (playFrameIdx >= holdFrames) { playPhase = 'intro_trans'; playFrameIdx = 0; }
            }
            else if (playPhase === 'intro_trans') {
                if (transFrames === 0) {
                    playPhase = 'run';
                    playFrameIdx = 0;
                    animationId = requestAnimationFrame(frame);
                    return;
                }
                const t = Math.min(playFrameIdx / transFrames, 1.0);
                const easeT = easeInOut(t);
                
                const cCenter = lerpLngLat(overview.center, startPos, easeT);
                const cZoom = lerp(overview.zoom, cameraZoom, easeT);
                const cPitch = lerp(0, cameraPitch, easeT);
                const cBearing = lerpBearing(0, startBearing, easeT);
                
                map.getSource('runner').setData({ 'type': 'Feature', 'geometry': { 'type': 'Point', 'coordinates': routeCoordinates[0] } });
                updateRouteSlicingByDist(0);
                map.jumpTo({ center: cCenter, zoom: cZoom, pitch: cPitch, bearing: cBearing, padding: { top: padTop * easeT, bottom: padBottom * easeT, left: 0, right: 0 } });
                renderStatsOverlay(0);
                
                playFrameIdx++;
                if (playFrameIdx > transFrames) { 
                    playPhase = 'run'; 
                    currentDistance = 0.0;
                    currentCameraBearing = startBearing;
                    currentCameraPos = [...startPos];
                    currentRunnerPos = [...routeCoordinates[0]];
                }
            }
            else if (playPhase === 'run') {
                if (currentDistance >= totalRouteDistance) {
                    playPhase = enableOutro ? 'outro_trans' : 'done';
                    playFrameIdx = 0;
                    outroStartCenter = [...currentCameraPos];
                    outroStartBearing = currentCameraBearing;
                    animationId = requestAnimationFrame(frame);
                    return;
                }
                
                const phys = calculateCameraPhysics(currentDistance, totalRouteDistance, currentCameraBearing);
                
                if (isTrackRun) {
                    let pWeight = Math.pow((100 - cameraSmoothness) / 100, 2) * 0.4 + 0.1;
                    currentCameraPos[0] += (trackCenter[0] - currentCameraPos[0]) * pWeight;
                    currentCameraPos[1] += (trackCenter[1] - currentCameraPos[1]) * pWeight;
                    currentCameraBearing = (currentDistance / totalRouteDistance) * 360;
                } else {
                    let pWeight = Math.pow((100 - cameraSmoothness) / 100, 2) * 0.4 + 0.1;
                    currentCameraPos[0] += (phys.rPos[0] - currentCameraPos[0]) * pWeight;
                    currentCameraPos[1] += (phys.rPos[1] - currentCameraPos[1]) * pWeight;
                    currentCameraBearing = phys.newBearing;
                }
                
                currentRunnerPos = [...phys.rPos];

                map.getSource('runner').setData({ 'type': 'Feature', 'geometry': { 'type': 'Point', 'coordinates': currentRunnerPos } });
                updateRouteSlicingByDist(currentDistance);
                
                map.jumpTo({ 
                    center: currentCameraPos, 
                    zoom: cameraZoom, 
                    pitch: cameraPitch, 
                    bearing: currentCameraBearing + cameraRotationOffset,
                    padding: { top: padTop, bottom: padBottom, left: 0, right: 0 }
                });
                
                renderStatsOverlay(currentDistance);
                currentDistance += step;
            }
            else if (playPhase === 'outro_trans') {
                if (transFrames === 0) {
                    playPhase = 'outro_hold';
                    playFrameIdx = 0;
                    animationId = requestAnimationFrame(frame);
                    return;
                }
                const t = Math.min(playFrameIdx / transFrames, 1.0);
                const easeT = easeInOut(t);
                
                const cCenter = lerpLngLat(outroStartCenter, overview.center, easeT);
                const cZoom = lerp(cameraZoom, overview.zoom, easeT);
                const cPitch = lerp(cameraPitch, 0, easeT);
                const cBearing = lerpBearing(outroStartBearing + cameraRotationOffset, 0, easeT);
                
                map.getSource('runner').setData({ 'type': 'Feature', 'geometry': { 'type': 'Point', 'coordinates': currentRunnerPos } });
                updateRouteSlicingByDist(totalRouteDistance);
                
                map.jumpTo({ center: cCenter, zoom: cZoom, pitch: cPitch, bearing: cBearing, padding: { top: padTop * (1-easeT), bottom: padBottom * (1-easeT), left: 0, right: 0 } });
                renderStatsOverlay(totalRouteDistance);
                
                playFrameIdx++;
                if (playFrameIdx > transFrames) { playPhase = 'outro_hold'; playFrameIdx = 0; }
            }
            else if (playPhase === 'outro_hold') {
                if (holdFrames === 0 || playFrameIdx >= holdFrames) {
                    playPhase = 'done';
                    animationId = requestAnimationFrame(frame);
                    return;
                }
                map.getSource('runner').setData({ 'type': 'Feature', 'geometry': { 'type': 'Point', 'coordinates': currentRunnerPos } });
                updateRouteSlicingByDist(totalRouteDistance);
                map.jumpTo({ center: overview.center, zoom: overview.zoom, pitch: 0, bearing: 0, padding: { top: 0, bottom: 0, left: 0, right: 0 } });
                renderStatsOverlay(totalRouteDistance);
                playFrameIdx++;
            }
            else if (playPhase === 'done') {
                document.getElementById('play-btn').disabled = false;
                hideRunner();
                currentDistance = 0.0;
                playFrameIdx = 0;
                playPhase = 'none';
                animationId = null;
                return;
            }

            if (playPhase !== 'done') {
                animationId = requestAnimationFrame(frame);
            }
        }
        frame();
    });

    document.getElementById('pause-btn').addEventListener('click', () => {
        cancelAnimationFrame(animationId);
        document.getElementById('play-btn').disabled = false;
        document.getElementById('pause-btn').disabled = true;
        document.getElementById('export-btn').disabled = false;
        document.getElementById('status').innerText = 'Playback Paused.';
    });

    document.getElementById('stop-btn').addEventListener('click', () => {
        cancelAnimationFrame(animationId);
        currentDistance = 0.0; 
        playFrameIdx = 0;
        playPhase = 'none';
        hideRunner();
        document.getElementById('play-btn').disabled = false;
        document.getElementById('pause-btn').disabled = true;
        document.getElementById('stop-btn').disabled = true;
        document.getElementById('export-btn').disabled = false;
        renderStatsOverlay(0.0);
        
        const overview = getOverviewCamera();
        map.jumpTo({ center: overview.center, zoom: overview.zoom, pitch: overview.pitch, bearing: overview.bearing, padding: { top: 0, bottom: 0, left: 0, right: 0 } });
        document.getElementById('status').innerText = 'Playback Stopped.';
    });

    // --- MASTER VIDEO EXPORT WITH EXACT 1:1 RESOLUTION SCALING ---
    async function triggerExport() {
        cancelAnimationFrame(animationId);
        document.getElementById('play-btn').disabled = true;
        document.getElementById('export-btn').disabled = true;
        
        const resKey = document.getElementById('export-res').value;
        const targetW = resolutionMap[resKey].w;
        const targetH = resolutionMap[resKey].h;
        const targetBR = resolutionMap[resKey].br;

        const fps = parseInt(document.getElementById('export-fps').value, 10);
        const showMileage = document.getElementById('show-mileage-checkbox').checked;
        const showTimer = document.getElementById('show-timer-checkbox').checked;
        const showPace = document.getElementById('show-pace-checkbox').checked;
        const showHR = document.getElementById('show-hr-checkbox').checked;
        const showGlucose = document.getElementById('show-glucose-checkbox').checked;
        const scaleFactor = parseFloat(document.getElementById('stat-size-slider').value);
        const layout = document.getElementById('stat-layout-select').value;
        
        const enableIntro = document.getElementById('show-intro-checkbox').checked;
        const enableOutro = document.getElementById('show-outro-checkbox').checked;
        const holdFrames = parseFloat(document.getElementById('hold-duration-slider').value) * fps;
        const transFrames = parseFloat(document.getElementById('transition-duration-slider').value) * fps;

        showRunner();

        const mapEl = document.getElementById('map');
        const originalClientHeight = mapEl.clientHeight || window.innerHeight;
        const originalWidth = mapEl.style.width;
        const originalHeight = mapEl.style.height;
        
        // Resize the container to render native sharp target resolution
        mapEl.style.width = targetW + 'px';
        mapEl.style.height = targetH + 'px';
        map.resize();

        // Wait to ensure MapLibre fully updates internal bounds
        await new Promise(r => setTimeout(r, 250));

        // SCALING MATH: Keeps everything visually 1:1 mathematically identical across resolutions
        const framingScale = targetH / originalClientHeight;
        const exportScale = scaleFactor * framingScale; 
        const zoomOffset = Math.log2(targetH / originalClientHeight);
        const exportCameraZoom = cameraZoom + zoomOffset;
        
        const padTopExport = cameraFramingOffset > 0 ? cameraFramingOffset * framingScale : 0;
        const padBottomExport = cameraFramingOffset < 0 ? Math.abs(cameraFramingOffset) * framingScale : 0;

        // Scale stroke thickness and runner circle for export
        const origRouteThickness = parseInt(document.getElementById('route-thickness-slider').value, 10);
        const origRunnerSize = parseInt(document.getElementById('runner-size-slider').value, 10);
        const exportRouteThickness = origRouteThickness * framingScale;
        const exportRunnerSize = origRunnerSize * framingScale;

        ['past', 'future'].forEach(t => {
            if (map.getLayer(`route-line-${t}-glow`)) map.setPaintProperty(`route-line-${t}-glow`, 'line-width', exportRouteThickness + (10 * framingScale));
            if (map.getLayer(`route-line-${t}-casing`)) map.setPaintProperty(`route-line-${t}-casing`, 'line-width', exportRouteThickness + (4 * framingScale));
            if (map.getLayer(`route-line-${t}`)) map.setPaintProperty(`route-line-${t}`, 'line-width', exportRouteThickness);
        });
        if (map.getLayer('runner-point')) {
            map.setPaintProperty('runner-point', 'circle-radius', exportRunnerSize);
            map.setPaintProperty('runner-point', 'circle-stroke-width', 4 * framingScale);
        }
        if (map.getLayer('runner-point-symbol')) map.setLayoutProperty('runner-point-symbol', 'icon-size', exportRunnerSize / 10);

        const mapCanvas = map.getCanvas();
        const compositeCanvas = document.createElement('canvas');
        compositeCanvas.width = targetW;
        compositeCanvas.height = targetH;
        const ctx = compositeCanvas.getContext('2d');

        try {
            let fileName = document.getElementById('export-filename').value.trim() || "My_Epic_Run";
            let fileStream = null;
            let target;
            
            if (window.showSaveFilePicker) {
                try {
                    const fileHandle = await window.showSaveFilePicker({ 
                        suggestedName: `${fileName}.webm`, 
                        types: [{ description: 'WebM Video', accept: { 'video/webm': ['.webm'] } }] 
                    });
                    fileStream = await fileHandle.createWritable();
                    target = new WebMMuxer.FileSystemWritableFileStreamTarget(fileStream);
                    document.getElementById('status').innerText = `Streaming ${resKey}p Video to Disk...`;
                } catch (err) {
                    document.getElementById('status').innerText = 'Export Canceled.';
                    throw err; 
                }
            } else {
                target = new WebMMuxer.ArrayBufferTarget();
            }

            const muxer = new WebMMuxer.Muxer({ target: target, video: { codec: 'V_VP9', width: targetW, height: targetH, frameRate: fps } });
            const videoEncoder = new VideoEncoder({ output: (chunk, meta) => muxer.addVideoChunk(chunk, meta), error: (e) => console.error(e) });
            videoEncoder.configure({ codec: 'vp09.00.10.08', width: targetW, height: targetH, bitrate: targetBR, framerate: fps });

            let frameIdx = 0;
            const step = (0.24 * speedMultiplier) / fps;
            const totalRunFrames = Math.ceil(totalRouteDistance / step);
            
            let totalF = totalRunFrames;
            if (enableIntro) totalF += holdFrames + transFrames;
            if (enableOutro) totalF += holdFrames + transFrames;

            // Frame Bake Recorder Function
            async function recordFrame(distValue) {
                await new Promise(r => { let f = 0; const c = () => { if (map.loaded() && map.areTilesLoaded()) { f++; if (f >= 5) return r(); } else f = 0; requestAnimationFrame(c); }; requestAnimationFrame(c); });
                ctx.drawImage(mapCanvas, 0, 0, targetW, targetH);
                
                let currentY = targetH - (40 * exportScale) - (60 * exportScale);
                let currentX = targetW - 40;
                const pt = originalDataPoints.find(p => p.dist >= distValue) || originalDataPoints[originalDataPoints.length-1];
                
                if (showMileage) {
                    const txt = (distValue * 0.621371).toFixed(2) + " MI"; 
                    const metrics = drawSickHUD(ctx, currentX, currentY, "DISTANCE", txt, "#ffffff", exportScale);
                    if (layout === 'horizontal') currentX -= (metrics.width + 12 * exportScale);
                    else currentY -= (metrics.height + 12 * exportScale);
                }
                if (showTimer) {
                    let timerTxt = "00:00";
                    if (pt && pt.time && originalDataPoints.length > 0 && originalDataPoints[0].time) {
                        timerTxt = formatTime(pt.time - originalDataPoints[0].time);
                    }
                    const metrics = drawSickHUD(ctx, currentX, currentY, "ELAPSED", timerTxt, "#00aeff", exportScale);
                    if (layout === 'horizontal') currentX -= (metrics.width + 12 * exportScale);
                    else currentY -= (metrics.height + 12 * exportScale);
                }
                if (showPace) {
                    let paceTxt = "--:-- /MI";
                    if (pt && pt.time && originalDataPoints.length > 0 && originalDataPoints[0].time && distValue > 0) {
                        let elapsedMins = (pt.time - originalDataPoints[0].time) / 60000;
                        let distMi = distValue * 0.621371;
                        if (distMi > 0.02) { 
                            let paceMins = elapsedMins / distMi;
                            if (paceMins < 99) {
                                let pM = Math.floor(paceMins);
                                let pS = Math.floor((paceMins - pM) * 60);
                                paceTxt = `${pM}:${pS.toString().padStart(2, '0')} /MI`;
                            }
                        }
                    }
                    const metrics = drawSickHUD(ctx, currentX, currentY, "PACE", paceTxt, "#ffb800", exportScale);
                    if (layout === 'horizontal') currentX -= (metrics.width + 12 * exportScale);
                    else currentY -= (metrics.height + 12 * exportScale);
                }
                if (showHR) {
                    let hrTxt = "-- BPM";
                    if (pt && pt.hr) hrTxt = pt.hr + " BPM";
                    const metrics = drawSickHUD(ctx, currentX, currentY, "HEART RATE", hrTxt, "#fc4c02", exportScale);
                    if (layout === 'horizontal') currentX -= (metrics.width + 12 * exportScale);
                    else currentY -= (metrics.height + 12 * exportScale);
                }
                if (showGlucose) {
                    let glucTxt = "-- mg/dL";
                    if (pt && pt.time && dexcomData.length > 0) {
                        let closest = dexcomData[0];
                        let minDiff = Math.abs(pt.time - closest.time);
                        for(let i=1; i<dexcomData.length; i++) {
                            let diff = Math.abs(pt.time - dexcomData[i].time);
                            if (diff < minDiff) { minDiff = diff; closest = dexcomData[i]; }
                        }
                        if (minDiff < 15 * 60 * 1000) glucTxt = closest.glucose + " mg/dL";
                    }
                    const metrics = drawSickHUD(ctx, currentX, currentY, "GLUCOSE", glucTxt, "#00a859", exportScale);
                    if (layout === 'horizontal') currentX -= (metrics.width + 12 * exportScale);
                    else currentY -= (metrics.height + 12 * exportScale);
                }

                const vFrame = new VideoFrame(compositeCanvas, { timestamp: (frameIdx * 1e6) / fps });
                videoEncoder.encode(vFrame, { keyFrame: frameIdx % 60 === 0 });
                vFrame.close(); frameIdx++;
                if (frameIdx % 10 === 0) document.getElementById('status').innerText = `Baking ${resKey}p Video: ${Math.round((frameIdx/totalF)*100)}%`;
            }

            const overview = getOverviewCamera();
            const physStart = calculateCameraPhysics(0, totalRouteDistance, 0);
            const startBearing = isTrackRun ? 0 : physStart.targetB;
            const startPos = isTrackRun ? trackCenter : routeCoordinates[0];

            // Phase 1: Intro
            if (enableIntro) {
                for (let f = 0; f < holdFrames; f++) {
                    map.getSource('runner').setData({ 'type': 'Feature', 'geometry': { 'type': 'Point', 'coordinates': routeCoordinates[0] } });
                    updateRouteSlicingByDist(0);
                    map.jumpTo({ center: overview.center, zoom: overview.zoom + zoomOffset, pitch: 0, bearing: 0, padding: { top: 0, bottom: 0, left: 0, right: 0 } });
                    await recordFrame(0);
                }
                for (let f = 0; f <= transFrames; f++) {
                    const t = f / transFrames;
                    const easeT = easeInOut(t);
                    const cCenter = lerpLngLat(overview.center, startPos, easeT);
                    const cZoom = lerp(overview.zoom + zoomOffset, exportCameraZoom, easeT);
                    const cPitch = lerp(0, cameraPitch, easeT);
                    const cBearing = lerpBearing(0, startBearing, easeT);
                    
                    map.getSource('runner').setData({ 'type': 'Feature', 'geometry': { 'type': 'Point', 'coordinates': routeCoordinates[0] } });
                    updateRouteSlicingByDist(0);
                    map.jumpTo({ center: cCenter, zoom: cZoom, pitch: cPitch, bearing: cBearing, padding: { top: padTopExport * easeT, bottom: padBottomExport * easeT, left: 0, right: 0 } });
                    await recordFrame(0);
                }
            }

            // Phase 2: Simulation Loop
            let exDist = 0.0;
            let exBearing = startBearing;
            let exPos = [...startPos];
            let exRunnerPos = [...routeCoordinates[0]];

            while (exDist < totalRouteDistance) {
                const phys = calculateCameraPhysics(exDist, totalRouteDistance, exBearing);
                
                if (isTrackRun) {
                    let pWeight = Math.pow((100 - cameraSmoothness) / 100, 2) * 0.4 + 0.1;
                    exPos[0] += (trackCenter[0] - exPos[0]) * pWeight;
                    exPos[1] += (trackCenter[1] - exPos[1]) * pWeight;
                    exBearing = (exDist / totalRouteDistance) * 360;
                } else {
                    let pWeight = Math.pow((100 - cameraSmoothness) / 100, 2) * 0.4 + 0.1;
                    exPos[0] += (phys.rPos[0] - exPos[0]) * pWeight;
                    exPos[1] += (phys.rPos[1] - exPos[1]) * pWeight;
                    exBearing = phys.newBearing;
                }
                
                exRunnerPos = [...phys.rPos];

                map.getSource('runner').setData({ 'type': 'Feature', 'geometry': { 'type': 'Point', 'coordinates': exRunnerPos } });
                updateRouteSlicingByDist(exDist);
                
                map.jumpTo({ center: exPos, zoom: exportCameraZoom, pitch: cameraPitch, bearing: exBearing + cameraRotationOffset, padding: { top: padTopExport, bottom: padBottomExport, left: 0, right: 0 } });
                await recordFrame(exDist);
                exDist += step;
            }

            // Phase 3: Outro
            if (enableOutro) {
                let exOutroStartCenter = [...exPos];
                let exOutroStartBearing = exBearing;
                for (let f = 0; f <= transFrames; f++) {
                    const t = f / transFrames;
                    const easeT = easeInOut(t);
                    const cCenter = lerpLngLat(exOutroStartCenter, overview.center, easeT);
                    const cZoom = lerp(exportCameraZoom, overview.zoom + zoomOffset, easeT);
                    const cPitch = lerp(cameraPitch, 0, easeT);
                    const cBearing = lerpBearing(exOutroStartBearing + cameraRotationOffset, 0, easeT);
                    
                    map.getSource('runner').setData({ 'type': 'Feature', 'geometry': { 'type': 'Point', 'coordinates': exRunnerPos } });
                    updateRouteSlicingByDist(totalRouteDistance);
                    map.jumpTo({ center: cCenter, zoom: cZoom, pitch: cPitch, bearing: cBearing, padding: { top: padTopExport * (1-easeT), bottom: padBottomExport * (1-easeT), left: 0, right: 0 } });
                    await recordFrame(totalRouteDistance);
                }
                for (let f = 0; f < holdFrames; f++) {
                    map.getSource('runner').setData({ 'type': 'Feature', 'geometry': { 'type': 'Point', 'coordinates': exRunnerPos } });
                    updateRouteSlicingByDist(totalRouteDistance);
                    map.jumpTo({ center: overview.center, zoom: overview.zoom + zoomOffset, pitch: 0, bearing: 0, padding: { top: 0, bottom: 0, left: 0, right: 0 } });
                    await recordFrame(totalRouteDistance);
                }
            }
            
            await videoEncoder.flush(); muxer.finalize();
            
            if (fileStream) {
                await fileStream.close(); 
            } else {
                const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([muxer.target.buffer], { type: 'video/webm' }));
                a.download = `${fileName}.webm`; a.click();
            }
            
            document.getElementById('status').innerText = 'Export Complete.';
        } catch (err) { 
            console.error(err); 
            if (document.getElementById('status').innerText !== 'Export Canceled.') {
                document.getElementById('status').innerText = 'Export Error (Check Console)';
            }
        } finally { 
            document.getElementById('play-btn').disabled = false; 
            document.getElementById('export-btn').disabled = false; 
            hideRunner(); 
            
            // Revert layout size adjustments
            mapEl.style.width = originalWidth || '100%';
            mapEl.style.height = originalHeight || '100%';
            map.resize();

            // Revert Paint Scale Attributes
            ['past', 'future'].forEach(t => {
                if (map.getLayer(`route-line-${t}-glow`)) map.setPaintProperty(`route-line-${t}-glow`, 'line-width', origRouteThickness + 10);
                if (map.getLayer(`route-line-${t}-casing`)) map.setPaintProperty(`route-line-${t}-casing`, 'line-width', origRouteThickness + 4);
                if (map.getLayer(`route-line-${t}`)) map.setPaintProperty(`route-line-${t}`, 'line-width', origRouteThickness);
            });
            if (map.getLayer('runner-point')) {
                map.setPaintProperty('runner-point', 'circle-radius', origRunnerSize);
                map.setPaintProperty('runner-point', 'circle-stroke-width', 4);
            }
            if (map.getLayer('runner-point-symbol')) map.setLayoutProperty('runner-point-symbol', 'icon-size', origRunnerSize / 10);
            
            // Jump back to correct preview overview
            const overview = getOverviewCamera();
            map.jumpTo({ center: overview.center, zoom: overview.zoom, pitch: overview.pitch, bearing: overview.bearing, padding: { top: 0, bottom: 0, left: 0, right: 0 } });
        }
    }

    document.getElementById('export-btn').addEventListener('click', triggerExport);
</script>
