<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Pro Route Flyover Engine - Studio Edition</title><script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script><link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" /><script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script><script src="https://unpkg.com/webm-muxer/build/webm-muxer.js"></script>
<style>
:root {
  --bg-dark: #121212;
  --surface: #1e1e1e;
  --surface-hover: #2a2a2a;
  --border: #333333;
  --border-light: #4a4a4a;
  --text-main: #f5f5f5;
  --text-muted: #9e9e9e;
  --accent: #10b981;
  --accent-hover: #34d399;
  --blue: #3b82f6;
  --danger: #f43f5e;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 18px;
  --shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
  --shadow-glow: 0 0 16px rgba(16, 185, 129, 0.25);
  --timeline-bg: #0a0a0a;
  --timeline-grid: rgba(255, 255, 255, 0.04);
  --font-stack: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: 'Fira Code', ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace;
}
body { margin: 0; padding: 0; font-family: var(--font-stack); background: var(--bg-dark); color: var(--text-main); overflow: hidden; -webkit-font-smoothing: antialiased; letter-spacing: 0.3px; }
#map { position: absolute; top: 0; bottom: 260px; width: 100%; transition: bottom .25s ease-out; background: #000; }
#ui-panel { position: absolute; top: 20px; left: 20px; bottom: 280px; width: 360px; display: flex; flex-direction: column; gap: 16px; z-index: 10; pointer-events: none; }
.panel-content { pointer-events: auto; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-right: 10px; padding-bottom: 20px; }
.panel-content::-webkit-scrollbar { width: 5px; }
.panel-content::-webkit-scrollbar-track { background: transparent; }
.panel-content::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 8px; }
.panel-content::-webkit-scrollbar-thumb:hover { background: var(--accent); }
h2 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.5px; background: linear-gradient(90deg, #ffffff, #34d399); -webkit-background-clip: text; -webkit-text-fill-color: transparent; pointer-events: auto; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.6)); }
details { background: var(--surface); border-radius: var(--radius-md); box-shadow: var(--shadow); border: 1px solid var(--border); overflow: hidden; transition: border-color 0.2s ease, box-shadow 0.2s ease; flex-shrink: 0; }
details:hover { border-color: var(--border-light); box-shadow: 0 12px 32px rgba(0,0,0,0.6); }
summary { padding: 14px 18px; font-weight: 600; font-size: 14px; color: var(--text-main); cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; user-select: none; transition: background .2s, color .2s; }
summary:hover { background: var(--surface-hover); color: var(--accent-hover); }
summary::-webkit-details-marker { display: none; }
summary::after { content: '›'; color: var(--text-muted); font-size: 20px; transition: transform .3s cubic-bezier(0.4, 0, 0.2, 1); transform: rotate(90deg); }
details[open] summary::after { transform: rotate(-90deg); color: var(--accent); }
details[open] summary { border-bottom: 1px solid var(--border); background: rgba(0, 0, 0, 0.2); }
.details-body { padding: 16px; display: flex; flex-direction: column; gap: 18px; background: rgba(0, 0, 0, 0.1); }
.control-group { display: flex; flex-direction: column; gap: 8px; }
.row-group { display: flex; gap: 12px; }
.row-group > * { flex: 1; }
label { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
.val-display { color: var(--text-main); font-weight: 700; display: flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 12px; }
.editable-val { cursor: text; transition: all .2s; border-radius: 4px; padding: 2px 6px; margin-right: -4px; border: 1px solid transparent; background: rgba(255,255,255,0.03); }
.editable-val:hover { color: var(--accent); background: rgba(16, 185, 129, 0.1); border-color: rgba(16, 185, 129, 0.2); }
.kf-btn { color: var(--text-muted); cursor: pointer; font-size: 14px; transition: all .2s; margin-left: 6px; }
.kf-btn:hover { color: var(--accent); transform: scale(1.2) translateY(-1px); }
.kf-btn.active { color: var(--accent); text-shadow: var(--shadow-glow); }
.reset-btn { color: rgba(255, 255, 255, 0.2); cursor: pointer; font-size: 13px; transition: all .2s; }
.reset-btn:hover { color: var(--text-main); transform: rotate(-90deg); }
input[type="file"] { display: none; }
input[type="range"] { width: 100%; cursor: pointer; height: 6px; background: var(--border); border-radius: 10px; appearance: none; outline: none; transition: background .2s; margin-top: 4px; }
input[type="range"]:hover { background: var(--border-light); }
input[type="range"]::-webkit-slider-thumb { appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); cursor: pointer; border: 2px solid var(--surface); box-shadow: 0 2px 6px rgba(0,0,0,0.6); transition: transform .2s ease; }
input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.25); background: var(--accent-hover); box-shadow: var(--shadow-glow); }
input[type="color"] { width: 100%; height: 36px; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 2px; cursor: pointer; background: var(--surface); transition: border-color .2s; }
input[type="color"]:hover { border-color: var(--accent); }
.text-input, .select-input { width: 100%; padding: 10px 14px; background: rgba(0, 0, 0, 0.3); color: var(--text-main); border: 1px solid var(--border); border-radius: var(--radius-sm); box-sizing: border-box; font-family: var(--font-stack); font-size: 13px; font-weight: 500; transition: all .2s ease; outline: none; }
.text-input:focus, .select-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2); background: rgba(0, 0, 0, 0.5); }
.checkbox-container { display: flex; align-items: center; justify-content: flex-start; gap: 10px; font-size: 12px; font-weight: 500; cursor: pointer; color: var(--text-main); text-transform: none; letter-spacing: 0; transition: color .2s; }
.checkbox-container:hover { color: var(--accent-hover); }
.checkbox-container input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; cursor: pointer; border-radius: 4px; }
.btn { display: flex; align-items: center; justify-content: center; width: 100%; padding: 12px 16px; border-radius: var(--radius-sm); cursor: pointer; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; transition: all .2s ease; box-sizing: border-box; border: none; }
.btn-upload { background: var(--surface-hover); color: var(--text-main); border: 1px solid var(--border); }
.btn-upload:hover { background: var(--border-light); color: #fff; border-color: var(--text-muted); }
.btn-primary { background: var(--accent); color: #000; }
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); transform: translateY(-1px); box-shadow: var(--shadow-glow); }
.btn-primary:disabled, .btn-secondary:disabled { background: var(--surface); color: var(--text-muted); border: 1px solid var(--border); cursor: not-allowed; opacity: 0.6; transform: none; box-shadow: none; }
#stats-overlay { position: absolute; display: flex; gap: 12px; pointer-events: none; z-index: 5; display: none; font-family: var(--font-mono); }
.stat-box { background: rgba(18, 18, 18, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-radius: var(--radius-sm); box-shadow: var(--shadow); display: flex; align-items: center; height: 56px; padding: 0 20px; border-left: 4px solid; position: relative; overflow: hidden; border-top: 1px solid var(--border); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.stat-label { font-size: 11px; color: var(--text-muted); font-weight: 600; text-align: right; margin-right: 14px; letter-spacing: 1.5px; }
.stat-value { font-size: 26px; font-weight: 700; }
#timeline-panel { position: absolute; bottom: 0; left: 0; width: 100%; height: 260px; background: var(--timeline-bg); border-top: 1px solid var(--border); display: flex; flex-direction: column; z-index: 1000; user-select: none; box-shadow: 0 -10px 40px rgba(0,0,0,0.6); }
#timeline-toolbar { height: 50px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: center; padding: 0 20px; flex-shrink: 0; position: relative; }
#timeline-toolbar .playback-controls { display: flex; gap: 10px; }
#timeline-toolbar .playback-controls button { background: rgba(0,0,0,0.2); border: 1px solid var(--border); color: var(--text-main); padding: 8px 18px; border-radius: var(--radius-sm); cursor: pointer; font-weight: 600; font-size: 12px; text-transform: uppercase; transition: all .2s; display: flex; align-items: center; gap: 6px; letter-spacing: 0.5px; }
#timeline-toolbar .playback-controls button:hover:not(:disabled) { background: var(--surface-hover); border-color: var(--border-light); }
#timeline-toolbar .playback-controls button:disabled { opacity: 0.3; cursor: not-allowed; border-color: transparent; }
#timeline-toolbar .playback-controls button.play-btn { background: rgba(16, 185, 129, 0.1); color: var(--accent); border-color: rgba(16, 185, 129, 0.3); }
#timeline-toolbar .playback-controls button.play-btn:hover:not(:disabled) { background: var(--accent); color: #000; box-shadow: var(--shadow-glow); }
#timeline-status { position: absolute; right: 20px; font-size: 12px; color: var(--text-muted); font-family: var(--font-mono); }
#timeline-body { display: flex; flex: 1; overflow: hidden; }
#timeline-labels { width: 240px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: hidden; flex-shrink: 0; z-index: 10; box-shadow: 4px 0 15px rgba(0,0,0,0.4); }
.track-label-header { height: 32px; background: var(--bg-dark); border-bottom: 1px solid var(--border); }
.track-label { height: 36px; line-height: 36px; padding: 0 16px; font-size: 11px; font-weight: 600; color: var(--text-main); border-bottom: 1px solid rgba(255, 255, 255, 0.03); display: flex; justify-content: space-between; align-items: center; background: transparent; transition: background 0.2s; }
.track-label:hover { background: rgba(255, 255, 255, 0.04); color: var(--accent); }
#timeline-tracks-scroll-container { flex: 1; overflow-x: auto; overflow-y: auto; background: var(--timeline-bg); position: relative; }
#timeline-zoom-container { width: 100%; min-height: 100%; position: relative; transform-origin: left top; }
#time-ruler { position: sticky; top: 0; left: 0; width: 100%; height: 32px; background: rgba(30, 30, 30, 0.95); backdrop-filter: blur(4px); border-bottom: 1px solid var(--border); z-index: 20; pointer-events: auto; cursor: ew-resize; }
#time-ruler-canvas { width: 100%; height: 100%; pointer-events: none; }
#timeline-grid-bg { position: absolute; top: 32px; left: 0; width: 100%; height: calc(100% - 32px); background-image: linear-gradient(to right, var(--timeline-grid) 1px, transparent 1px), linear-gradient(to bottom, var(--timeline-grid) 1px, transparent 1px); background-size: 5% 36px; pointer-events: none; opacity: 0.8; }
#timeline-tracks { position: absolute; top: 32px; left: 0; width: 100%; }
.track-lane { height: 36px; position: relative; border-bottom: 1px solid rgba(255, 255, 255, 0.02); transition: background 0.2s; }
.track-lane:hover { background: rgba(255, 255, 255, 0.02); }
.keyframe { position: absolute; top: 50%; transform: translate(-50%, -50%) rotate(45deg); width: 12px; height: 12px; background: var(--text-muted); border: 2px solid var(--bg-dark); cursor: grab; z-index: 5; transition: background .15s, transform .15s, border-color .15s; border-radius: 3px; }
.keyframe:active { cursor: grabbing; transform: translate(-50%, -50%) rotate(45deg) scale(0.9); }
.keyframe::after { content: ''; position: absolute; top: -10px; left: -10px; right: -10px; bottom: -10px; cursor: inherit; }
.keyframe:hover { background: #fff; transform: translate(-50%, -50%) rotate(45deg) scale(1.3); z-index: 10; border-color: var(--accent); }
.keyframe.active { background: var(--accent); border-color: #fff; z-index: 10; box-shadow: var(--shadow-glow); }
.keyframe.editing { background: var(--text-main); border-color: var(--accent); box-shadow: 0 0 15px rgba(16, 185, 129, 0.6); transform: translate(-50%, -50%) rotate(45deg) scale(1.4); z-index: 15; }
#playhead { position: absolute; top: 32px; bottom: 0; width: 2px; background: var(--accent); z-index: 10; pointer-events: none; transform: translateX(-50%); box-shadow: 0 0 12px rgba(16, 185, 129, 0.5); }
#playhead::before { content: ''; position: absolute; top: -32px; left: 50%; transform: translateX(-50%); width: 14px; height: 14px; background: var(--accent); border-radius: 2px; clip-path: polygon(0 0, 100% 0, 100% 60%, 50% 100%, 0 60%); }
.kf-clear-btn { background: none; border: none; color: rgba(255, 255, 255, 0.2); font-size: 16px; font-weight: bold; cursor: pointer; padding: 2px 6px; border-radius: 4px; transition: all .2s; }
.kf-clear-btn:hover { color: var(--danger); background: rgba(244, 63, 94, 0.15); }
#kf-editor { position: absolute; background: rgba(30, 30, 30, 0.95); backdrop-filter: blur(12px); border: 1px solid var(--border-light); border-radius: var(--radius-md); padding: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.8); z-index: 2000; display: none; flex-direction: column; gap: 14px; width: 220px; }
#kf-editor h4 { margin: 0; color: var(--text-main); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
#kf-editor .editor-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600; color: var(--text-muted); }
#kf-editor input { width: 90px; background: rgba(0,0,0,0.4); color: white; border: 1px solid var(--border); padding: 8px 10px; border-radius: var(--radius-sm); font-family: var(--font-mono); font-size: 12px; outline: none; transition: all .2s; }
#kf-editor input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2); }
#kf-editor input[type="color"] { padding: 0; width: 90px; height: 32px; }
#export-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(10px); z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; }
.export-card { background: var(--surface); padding: 36px; border-radius: var(--radius-lg); border: 1px solid var(--border-light); box-shadow: 0 25px 60px rgba(0,0,0,0.9); width: 500px; display: flex; flex-direction: column; gap: 24px; }
.export-preview { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border); position: relative; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); }
.export-preview canvas { width: 100%; height: 100%; object-fit: contain; }
.export-progress-bar { width: 100%; height: 12px; background: rgba(0, 0, 0, 0.5); border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }
.export-progress-fill { height: 100%; background: linear-gradient(90deg, #10b981, #34d399); width: 0%; transition: width .1s linear; box-shadow: var(--shadow-glow); }
.export-stats { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-muted); font-family: var(--font-mono); font-weight: 600; text-transform: uppercase; }
.spinner { width: 20px; height: 20px; border: 3px solid rgba(16, 185, 129, 0.2); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; display: inline-block; }
@keyframes spin { 100% { transform: rotate(360deg); } }
.resize-handle-x { position: absolute; right: -4px; top: 0; bottom: 0; width: 8px; cursor: ew-resize; z-index: 100; pointer-events: auto; }
.resize-handle-x:hover { background: rgba(16, 185, 129, 0.2); }
.collapse-tab-x { position: absolute; right: -28px; top: 20px; width: 28px; height: 44px; background: var(--surface); border: 1px solid var(--border); border-left: none; border-radius: 0 6px 6px 0; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-main); z-index: 100; pointer-events: auto; transition: background 0.2s, color 0.2s; font-size: 16px; user-select: none; box-shadow: 4px 0 10px rgba(0,0,0,0.4); }
.collapse-tab-x:hover { background: var(--surface-hover); color: var(--accent); }
.resize-handle-y { position: absolute; top: -4px; left: 0; right: 0; height: 8px; cursor: ns-resize; z-index: 100; pointer-events: auto; }
.resize-handle-y:hover { background: rgba(16, 185, 129, 0.2); }
.collapse-tab-y { position: absolute; top: -28px; right: 20px; width: 44px; height: 28px; background: var(--surface); border: 1px solid var(--border); border-bottom: none; border-radius: 6px 6px 0 0; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-main); z-index: 100; pointer-events: auto; transition: background 0.2s, color 0.2s; font-size: 16px; user-select: none; box-shadow: 0 -4px 10px rgba(0,0,0,0.4); }
.collapse-tab-y:hover { background: var(--surface-hover); color: var(--accent); }
</style></head>
<body>
<div id="export-modal"><div class="export-card"><h3 style="margin:0;font-size:20px;display:flex;align-items:center;gap:12px;letter-spacing:0.5px;font-weight:700;"><span class="spinner"></span> Rendering Video...</h3><div class="export-preview"><canvas id="export-preview-canvas"></canvas></div><div class="export-progress-bar"><div class="export-progress-fill" id="export-progress-fill"></div></div><div class="export-stats"><span id="export-pct" style="color:var(--text-main)">0%</span> <span id="export-eta">Calculating ETA...</span></div><button id="cancel-export-btn" class="btn btn-upload" style="margin-top:8px;color:var(--danger);border-color:rgba(244,63,94,0.3)">Cancel Export</button></div></div>
<div id="map"></div><div id="stats-overlay"></div>
<div id="kf-editor"><h4 id="kf-editor-title">Edit Keyframe</h4><div class="editor-row"><span>Time (%)</span><input type="number" id="kf-edit-time" step="0.1" min="0" max="100"></div><div class="editor-row"><span>Value</span><input type="text" id="kf-edit-value"></div><div class="row-group" style="margin-top:8px"><button class="btn btn-primary" onclick="saveKf()">Save</button> <button class="btn btn-upload" style="color:var(--danger);border-color:var(--danger)" onclick="deleteKf()">Delete</button></div></div>
<div id="ui-panel"><div id="ui-resizer" class="resize-handle-x"></div><div id="ui-tab" class="collapse-tab-x">⟨</div><h2>Flyover Studio</h2><div class="panel-content"><details open><summary>1. Data & Assets</summary><div class="details-body"><div class="control-group"><label for="gpx-upload" class="btn btn-upload">Load GPX Route</label><input type="file" id="gpx-upload" accept=".gpx" /></div><div class="control-group"><label for="dexcom-upload" class="btn btn-upload">Load CGM Data (CSV)</label><input type="file" id="dexcom-upload" accept=".csv,.txt" /></div></div></details><details><summary>2. Camera & Environment</summary><div class="details-body"><div class="control-group"><label>Playback Speed <span class="val-display"><span class="reset-btn" onclick="resetSetting('speed')" title="Reset">↺</span><span class="kf-btn" onclick="toggleKeyframe('speed')" title="Toggle Keyframe at Playhead">♦</span> <span id="speed-display" class="editable-val" ondblclick="editInline(this, 'speed')">1.0x</span></span></label><input type="range" id="speed-slider" min="0.1" max="25" step="0.1" value="1"></div><div class="control-group"><label>Base Zoom <span class="val-display"><span class="reset-btn" onclick="resetSetting('zoom')" title="Reset">↺</span><span class="kf-btn" onclick="toggleKeyframe('zoom')" title="Toggle Keyframe at Playhead">♦</span> <span id="zoom-display" class="editable-val" ondblclick="editInline(this, 'zoom')">15.8</span></span></label><input type="range" id="zoom-slider" min="13.0" max="18.0" step="0.1" value="15.8"></div><div class="control-group"><label>Pitch (Angle) <span class="val-display"><span class="reset-btn" onclick="resetSetting('pitch')" title="Reset">↺</span><span class="kf-btn" onclick="toggleKeyframe('pitch')" title="Toggle Keyframe at Playhead">♦</span> <span id="pitch-display" class="editable-val" ondblclick="editInline(this, 'pitch')">60°</span></span></label><input type="range" id="pitch-slider" min="0" max="85" step="1" value="60"></div><div class="control-group"><label>Vertical Framing <span class="val-display"><span class="reset-btn" onclick="resetSetting('framing')" title="Reset">↺</span><span class="kf-btn" onclick="toggleKeyframe('framing')" title="Toggle Keyframe at Playhead">♦</span> <span id="framing-display" class="editable-val" ondblclick="editInline(this, 'framing')">Center</span></span></label><input type="range" id="framing-slider" min="-300" max="300" step="10" value="0"></div><div class="control-group"><label>Rotation Offset <span class="val-display"><span class="reset-btn" onclick="resetSetting('rotation')" title="Reset">↺</span><span class="kf-btn" onclick="toggleKeyframe('rotation')" title="Toggle Keyframe at Playhead">♦</span> <span id="rotation-display" class="editable-val" ondblclick="editInline(this, 'rotation')">0°</span></span></label><input type="range" id="rotation-slider" min="-3600" max="3600" step="1" value="0"></div><div class="control-group"><label>Camera Smoothness <span class="val-display"><span class="reset-btn" onclick="resetSetting('smoothness')" title="Reset">↺</span><span class="kf-btn" onclick="toggleKeyframe('smoothness')" title="Toggle Keyframe at Playhead">♦</span> <span id="smoothness-display" class="editable-val" ondblclick="editInline(this, 'smoothness')">45%</span></span></label><input type="range" id="smoothness-slider" min="0" max="100" step="1" value="45"></div><div class="control-group"><label>Terrain Exag. <span class="val-display"><span class="reset-btn" onclick="resetSetting('terrain')" title="Reset">↺</span><span class="kf-btn" onclick="toggleKeyframe('terrain')" title="Toggle Keyframe at Playhead">♦</span> <span id="terrain-display" class="editable-val" ondblclick="editInline(this, 'terrain')">1.0x</span></span></label><input type="range" id="terrain-slider" min="0" max="5" step="0.1" value="1"></div><div class="control-group"><label>Time of Day <span class="val-display"><span class="reset-btn" onclick="resetSetting('timeOfDay')" title="Reset">↺</span> lignY')">♦</span></span></label><select id="hud-align-y" class="select-input"><option value="0">Top</option><option value="1">Center</option><option value="2" selected>Bottom</option></select></div></div><div class="row-group"><div class="control-group" style="justify-content:center; margin-top:10px;"><label class="checkbox-container"><input type="checkbox" id="hud-bg-checkbox" checked> Show Background <span style="margin-left:auto"><span class="reset-btn" onclick="event.preventDefault();event.stopPropagation();resetSetting('hudBackground')">↺</span><span class="kf-btn" onclick="event.preventDefault();event.stopPropagation();toggleKeyframe('hudBackground')">♦</span></span></label></div><div class="control-group"><label>Text Color <span class="val-display"><span class="reset-btn" onclick="resetSetting('hudTextColor')">↺</span><span class="kf-btn" onclick="toggleKeyframe('hudTextColor')">♦</span></span></label><input type="color" id="hud-text-color" value="#ffffff"></div></div></div></details><details><summary>8. Intro & Outro Settings</summary><div class="details-body"><div class="control-group" style="gap:12px"><label class="checkbox-container"><input type="checkbox" id="show-intro-checkbox" checked> Show Full Path Intro</label><label class="checkbox-container"><input type="checkbox" id="show-outro-checkbox" checked> Show Full Path Outro</label></div><div class="row-group"><div class="control-group"><label>Hold Time <span id="hold-duration-display" class="val-display editable-val" ondblclick="editInline(this, 'holdDuration')">1.5s</span></label><input type="range" id="hold-duration-slider" min="0" max="5" step="0.5" value="1.5"></div><div class="control-group"><label>Transition <span id="transition-duration-display" class="val-display editable-val" ondblclick="editInline(this, 'transitionDuration')">2.0s</span></label><input type="range" id="transition-duration-slider" min="0.5" max="5" step="0.5" value="2.0"></div></div></div></details><details><summary>9. Video Export</summary><div class="details-body"><div class="control-group"><label>File Name</label><input type="text" id="export-filename" class="text-input" value="My_Epic_Run"></div><div class="row-group"><div class="control-group"><label>Resolution</label><select id="export-res" class="select-input"><option value="720">720p (HD)</option><option value="1080">1080p (FHD)</option><option value="1440">2K (1440p)</option><option value="2160" selected>4K (UHD)</option><option value="4320">8K (FUHD)</option></select></div><div class="control-group"><label>Frame Rate</label><select id="export-fps" class="select-input"><option value="24">24 FPS</option><option value="30">30 FPS</option><option value="60" selected>60 FPS</option></select></div></div><button id="export-btn" class="btn btn-primary" disabled>Export Video</button></div></details></div></div>

<script>
const map=new maplibregl.Map({container:'map',center:[-122.4194,37.7749],zoom:11,pitch:60,bearing:0,preserveDrawingBuffer:true,style:{version:8,sources:{'satellite-tiles':{type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],tileSize:256,maxzoom:17},'terrain-source':{type:'raster-dem',tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],encoding:'terrarium',tileSize:256,maxzoom:13}},layers:[{id:'satellite-layer',type:'raster',source:'satellite-tiles'}],terrain:{source:'terrain-source',exaggeration:1}}});
const domCache={};const getEl=(id)=>domCache[id]||(domCache[id]=document.getElementById(id));
const mapStateCache={};
function updateMapPaint(layer,prop,value){const key=`${layer}_paint_${prop}`;if(mapStateCache[key]!==value){map.setPaintProperty(layer,prop,value);mapStateCache[key]=value;}}
function updateMapLayout(layer,prop,value){const key=`${layer}_layout_${prop}`;if(mapStateCache[key]!==value){map.setLayoutProperty(layer,prop,value);mapStateCache[key]=value;}}
function updateMapTerrain(source,exaggeration){const key=`terrain_exag`;if(mapStateCache[key]!==exaggeration){map.setTerrain({source:source,exaggeration:exaggeration});mapStateCache[key]=exaggeration;}}
let routeCoordinates=[],originalDataPoints=[],dexcomData=[],animationId=null,currentDistance=0.0,currentCameraBearing=0,currentCameraPos=[0,0],currentRunnerPos=[0,0],playPhase='none',playFrameIdx=0,outroStartCenter=[0,0],outroStartBearing=0,rawRouteLine=null,totalRouteDistance=0,speedMultiplier=1.0,useCustomImage=false,isExporting=false,isTrackRun=false,trackCenter=[0,0];
window.cancelExportFlag=false;
const resolutionMap={"720":{w:1280,h:720,br:10000000},"1080":{w:1920,h:1080,br:25000000},"1440":{w:2560,h:1440,br:40000000},"2160":{w:3840,h:2160,br:80000000},"4320":{w:7680,h:4320,br:150000000}};
window.addEventListener('keydown',(e)=>{if(e.code==='Space'){const activeTag=document.activeElement?document.activeElement.tagName:'';if(activeTag==='INPUT'||activeTag==='TEXTAREA'||activeTag==='SELECT')return;e.preventDefault();if(playPhase==='none'||playPhase==='done'){if(!getEl('play-btn').disabled)getEl('play-btn').click();}else{if(!getEl('pause-btn').disabled)getEl('pause-btn').click();}}});
function hexToRgb(hex){let c=hex.substring(1).split('');if(c.length===3)c=[c[0],c[0],c[1],c[1],c[2],c[2]];c='0x'+c.join('');return[(c>>16)&255,(c>>8)&255,c&255];}
function rgbToHex(r,g,b){return"#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
function lerpColor(a,b,t){const ca=hexToRgb(a);const cb=hexToRgb(b);const r=Math.round(ca[0]+(cb[0]-ca[0])*t);const g=Math.round(ca[1]+(cb[1]-ca[1])*t);const bl=Math.round(ca[2]+(cb[2]-ca[2])*t);return rgbToHex(r,g,bl);}
function lerp(start,end,t){return start+(end-start)*t;}
function lerpLngLat(start,end,t){return[lerp(start[0],end[0],t),lerp(start[1],end[1],t)];}

let lastPinColor = '';
let lastNumMarkers = 0;
function updateMarkerPinImages(color) {
    if (!totalRouteDistance) return;
    const numMarkers = Math.floor(totalRouteDistance * 0.621371);
    if (color === lastPinColor && numMarkers === lastNumMarkers) return;
    lastPinColor = color;
    lastNumMarkers = numMarkers;
    const w = 128, h = 160;
    for (let i = 1; i <= numMarkers; i++) {
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = color;
        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur = 10;
        ctx.shadowOffsetY = 4;
        ctx.beginPath();
        const cx = 64, cy = 64, r = 52;
        ctx.arc(cx, cy, r, Math.PI, 0, false);
        ctx.bezierCurveTo(cx + r, cy + r, cx, 150, cx, 150);
        ctx.bezierCurveTo(cx, 150, cx - r, cy + r, cx - r, cy);
        ctx.fill();
        ctx.shadowColor = 'transparent';
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 6;
        ctx.stroke();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(cx, cy, r * 0.75, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = color;
        ctx.font = 'bold 40px ui-monospace, monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(i.toString(), cx, cy + 2);
        const imgData = ctx.getImageData(0, 0, w, h);
        const imgName = 'mile-pin-' + i;
        if (map.hasImage(imgName)) {
            map.updateImage(imgName, imgData);
        } else {
            map.addImage(imgName, imgData);
        }
    }
}

    const m = document.getElementById('map');
    const ui = document.getElementById('ui-panel');
    const tab = document.getElementById('timeline-tab');
    p.style.transition = "transform 0.3s cubic-bezier(0.4, 0, 0.2, 1)";
    m.style.transition = "bottom 0.3s cubic-bezier(0.4, 0, 0.2, 1)";
    ui.style.transition = "bottom 0.3s cubic-bezier(0.4, 0, 0.2, 1)";
    if(tCol) {
        p.style.transform = `translateY(100%)`;
        m.style.bottom = "0px";
        ui.style.bottom = "20px";
        tab.innerHTML = "↑";
    } else {
        p.style.transform = `none`;
        m.style.bottom = timelineH + "px";
        ui.style.bottom = (timelineH + 20) + "px";
        tab.innerHTML = "↓";
    }
    setTimeout(() => {
        p.style.transition = "";
        m.style.transition = "bottom .25s ease-out";
        ui.style.transition = "";
        if(map) map.resize();
    }, 300);
});

let rUi=false, rTim=false;
document.getElementById('ui-resizer').addEventListener('mousedown', e => { if(uCol)return; rUi=true; document.body.style.cursor='ew-resize'; e.preventDefault(); });
document.getElementById('timeline-resizer').addEventListener('mousedown', e => { if(tCol)return; rTim=true; document.body.style.cursor='ns-resize'; e.preventDefault(); });

window.addEventListener('mousemove', e => {
    if(rUi) {
        uiW = Math.max(200, Math.min(e.clientX - 20, window.innerWidth - 100));
        document.getElementById('ui-panel').style.width = uiW + 'px';
    }
    if(rTim) {
        timelineH = Math.max(100, Math.min(window.innerHeight - e.clientY, window.innerHeight - 100));
        document.getElementById('timeline-panel').style.height = timelineH + 'px';
        if(!tCol) {
            document.getElementById('map').style.bottom = timelineH + 'px';
            document.getElementById('ui-panel').style.bottom = (timelineH + 20) + 'px';
        }
    }
});

window.addEventListener('mouseup', () => {
    if(rUi || rTim) {
        rUi = false; rTim = false;
        document.body.style.cursor = 'default';
        if(map) map.resize();
    }
});
</script></body></html>
